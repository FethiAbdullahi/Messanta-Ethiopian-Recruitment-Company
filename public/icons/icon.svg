<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)"/>
  
  <!-- Stylized "S" for Skills -->
  <path d="M256 80c-70 0-126 40-126 90 0 50 56 70 126 90s126 40 126 90c0 50-56 90-126 90" 
        fill="none" 
        stroke="white" 
        stroke-width="48" 
        stroke-linecap="round"/>
  
  <!-- Life symbol - small heart/spark -->
  <circle cx="380" cy="130" r="24" fill="url(#accentGradient)" opacity="0.9"/>
  <circle cx="132" cy="382" r="24" fill="url(#accentGradient)" opacity="0.9"/>
</svg>


